services:
  db-socket:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: ctf
      MARIADB_USER: ctfuser
      MARIADB_PASSWORD: ctfpass
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./app
    environment:
      DB_HOST: db-socket
      DB_USER: ctfuser
      DB_PASS: ctfpass
      DB_NAME: ctf
      PORT: "8080"
    ports:
      - "8003:8080"
    depends_on:
      db-socket:
        condition: service_healthy
